<svg width="100%" viewBox="0 0 680 1060" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Project Blueprint Agent Architecture</title>
  <desc>LangGraph-based multi-agent architecture for generating project blueprints from vague ideas</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="1060" fill="rgb(28,28,26)"/>

  <!-- ── INPUT ─────────────────────────────────────────────────────── -->
  <g>
    <rect x="240" y="20" width="200" height="52" rx="8" fill="rgb(68,68,65)" stroke="rgb(180,178,169)" stroke-width="0.5"/>
    <text x="340" y="42" text-anchor="middle" dominant-baseline="central" fill="rgb(211,209,199)" font-family="system-ui,sans-serif" font-size="14" font-weight="500">User Input</text>
    <text x="340" y="60" text-anchor="middle" dominant-baseline="central" fill="rgb(180,178,169)" font-family="system-ui,sans-serif" font-size="12">"I want to build an app that…"</text>
  </g>

  <!-- Arrow -->
  <line x1="340" y1="72" x2="340" y2="106" marker-end="url(#arrow)" stroke="rgb(156,154,146)" stroke-width="1.5"/>

  <!-- ── NODE 1: Orchestrator ───────────────────────────────────────── -->
  <g>
    <rect x="200" y="108" width="280" height="52" rx="8" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="0.5"/>
    <text x="340" y="128" text-anchor="middle" dominant-baseline="central" fill="rgb(206,203,246)" font-family="system-ui,sans-serif" font-size="14" font-weight="500">1. Orchestrator node</text>
    <text x="340" y="148" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)" font-family="system-ui,sans-serif" font-size="12">Entry point · sets state · routes pipeline</text>
  </g>

  <!-- Arrow -->
  <line x1="340" y1="160" x2="340" y2="194" marker-end="url(#arrow)" stroke="rgb(156,154,146)" stroke-width="1.5"/>

  <!-- ── NODE 2: Clarification Agent ───────────────────────────────── -->
  <g>
    <rect x="200" y="196" width="280" height="52" rx="8" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="0.5"/>
    <text x="340" y="216" text-anchor="middle" dominant-baseline="central" fill="rgb(206,203,246)" font-family="system-ui,sans-serif" font-size="14" font-weight="500">2. Clarification agent node</text>
    <text x="340" y="236" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)" font-family="system-ui,sans-serif" font-size="12">LLM finds gaps · sets needs_human_input</text>
  </g>

  <!-- Conditional label -->
  <text x="340" y="265" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)" font-family="system-ui,sans-serif" font-size="11">conditional edge</text>

  <!-- Arrow left to HITL -->
  <line x1="280" y1="248" x2="150" y2="290" marker-end="url(#arrow)" stroke="rgb(239,159,39)" stroke-width="1.5"/>
  <!-- Arrow right — skip HITL -->
  <line x1="400" y1="248" x2="490" y2="290" marker-end="url(#arrow)" stroke="rgb(156,154,146)" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- ── NODE 3a: HITL Node ─────────────────────────────────────────── -->
  <g>
    <rect x="34" y="292" width="232" height="68" rx="8" fill="rgb(90,60,20)" stroke="rgb(239,159,39)" stroke-width="0.5"/>
    <text x="150" y="314" text-anchor="middle" dominant-baseline="central" fill="rgb(255,210,130)" font-family="system-ui,sans-serif" font-size="14" font-weight="500">3a. HITL node</text>
    <text x="150" y="332" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)" font-family="system-ui,sans-serif" font-size="12">interrupt() · graph pauses</text>
    <text x="150" y="350" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)" font-family="system-ui,sans-serif" font-size="12">Command(resume=answers)</text>
  </g>

  <!-- Skip label -->
  <text x="520" y="310" text-anchor="middle" dominant-baseline="central" fill="rgb(156,154,146)" font-family="system-ui,sans-serif" font-size="11" font-style="italic">idea already clear</text>

  <!-- HITL arrow rejoins -->
  <line x1="150" y1="360" x2="150" y2="400" stroke="rgb(239,159,39)" stroke-width="1.5"/>
  <line x1="150" y1="400" x2="300" y2="430" marker-end="url(#arrow)" stroke="rgb(239,159,39)" stroke-width="1.5"/>

  <!-- Skip arrow rejoins -->
  <line x1="520" y1="360" x2="520" y2="400" stroke="rgb(156,154,146)" stroke-width="1.5" stroke-dasharray="5,3"/>
  <line x1="520" y1="400" x2="400" y2="430" marker-end="url(#arrow)" stroke="rgb(156,154,146)" stroke-width="1.5" stroke-dasharray="5,3"/>

  <!-- ── NODE 4: Validation Agent ───────────────────────────────────── -->
  <g>
    <rect x="200" y="432" width="280" height="68" rx="8" fill="rgb(20,75,55)" stroke="rgb(93,202,165)" stroke-width="0.5"/>
    <text x="340" y="454" text-anchor="middle" dominant-baseline="central" fill="rgb(160,235,210)" font-family="system-ui,sans-serif" font-size="14" font-weight="500">4. Validation agent node</text>
    <text x="340" y="472" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)" font-family="system-ui,sans-serif" font-size="12">Tool: Tavily web search</text>
    <text x="340" y="490" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)" font-family="system-ui,sans-serif" font-size="12">competitors · market fit · unique angle</text>
  </g>

  <!-- Arrow -->
  <line x1="340" y1="500" x2="340" y2="534" marker-end="url(#arrow)" stroke="rgb(156,154,146)" stroke-width="1.5"/>

  <!-- ── NODE 5: Architecture Agent ─────────────────────────────────── -->
  <g>
    <rect x="200" y="536" width="280" height="68" rx="8" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="0.5"/>
    <text x="340" y="558" text-anchor="middle" dominant-baseline="central" fill="rgb(206,203,246)" font-family="system-ui,sans-serif" font-size="14" font-weight="500">5. Architecture agent node</text>
    <text x="340" y="576" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)" font-family="system-ui,sans-serif" font-size="12">components · DB schema · API routes</text>
    <text x="340" y="594" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)" font-family="system-ui,sans-serif" font-size="12">SVG diagram → state["architecture.svg"]</text>
  </g>

  <!-- Arrow -->
  <line x1="340" y1="604" x2="340" y2="638" marker-end="url(#arrow)" stroke="rgb(156,154,146)" stroke-width="1.5"/>

  <!-- ── NODE 6: Stack Agent ────────────────────────────────────────── -->
  <g>
    <rect x="200" y="640" width="280" height="68" rx="8" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="0.5"/>
    <text x="340" y="662" text-anchor="middle" dominant-baseline="central" fill="rgb(206,203,246)" font-family="system-ui,sans-serif" font-size="14" font-weight="500">6. Stack agent node</text>
    <text x="340" y="680" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)" font-family="system-ui,sans-serif" font-size="12">frontend · backend · DB · infra</text>
    <text x="340" y="698" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)" font-family="system-ui,sans-serif" font-size="12">skill-aware · reason per choice</text>
  </g>

  <!-- Arrow -->
  <line x1="340" y1="708" x2="340" y2="742" marker-end="url(#arrow)" stroke="rgb(156,154,146)" stroke-width="1.5"/>

  <!-- ── NODE 7: Execution Agent ────────────────────────────────────── -->
  <g>
    <rect x="200" y="744" width="280" height="68" rx="8" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="0.5"/>
    <text x="340" y="766" text-anchor="middle" dominant-baseline="central" fill="rgb(206,203,246)" font-family="system-ui,sans-serif" font-size="14" font-weight="500">7. Execution agent node</text>
    <text x="340" y="784" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)" font-family="system-ui,sans-serif" font-size="12">phases · MVP scope · timeline</text>
    <text x="340" y="802" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)" font-family="system-ui,sans-serif" font-size="12">risks · where you'll get stuck</text>
  </g>

  <!-- Arrow -->
  <line x1="340" y1="812" x2="340" y2="846" marker-end="url(#arrow)" stroke="rgb(156,154,146)" stroke-width="1.5"/>

  <!-- ── NODE 8: Blueprint Generator ───────────────────────────────── -->
  <g>
    <rect x="200" y="848" width="280" height="68" rx="8" fill="rgb(60,52,137)" stroke="rgb(175,169,236)" stroke-width="0.5"/>
    <text x="340" y="870" text-anchor="middle" dominant-baseline="central" fill="rgb(206,203,246)" font-family="system-ui,sans-serif" font-size="14" font-weight="500">8. Blueprint generator node</text>
    <text x="340" y="888" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)" font-family="system-ui,sans-serif" font-size="12">compiles full state → markdown + PDF</text>
    <text x="340" y="906" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)" font-family="system-ui,sans-serif" font-size="12">embeds SVG diagram · downloadable</text>
  </g>

  <!-- Arrow -->
  <line x1="340" y1="916" x2="340" y2="950" marker-end="url(#arrow)" stroke="rgb(156,154,146)" stroke-width="1.5"/>

  <!-- ── OUTPUT ─────────────────────────────────────────────────────── -->
  <g>
    <rect x="220" y="952" width="240" height="28" rx="6" fill="rgb(68,68,65)" stroke="rgb(180,178,169)" stroke-width="0.5"/>
    <text x="340" y="966" text-anchor="middle" dominant-baseline="central" fill="rgb(211,209,199)" font-family="system-ui,sans-serif" font-size="13" font-weight="500">Project Blueprint PDF + Markdown</text>
  </g>

  <!-- ── STATE SIDEBAR ──────────────────────────────────────────────── -->
  <rect x="590" y="108" width="76" height="812" rx="6" fill="rgb(35,35,32)" stroke="rgb(80,80,75)" stroke-width="0.5"/>
  <text x="628" y="136" text-anchor="middle" dominant-baseline="central" fill="rgb(130,128,120)" font-family="system-ui,sans-serif" font-size="10" font-weight="600" letter-spacing="1">STATE</text>

  <text x="628" y="170" text-anchor="middle" dominant-baseline="central" fill="rgb(100,98,90)" font-family="system-ui,monospace" font-size="9">raw_idea</text>
  <text x="628" y="222" text-anchor="middle" dominant-baseline="central" fill="rgb(100,98,90)" font-family="system-ui,monospace" font-size="9">clarified_idea</text>
  <text x="628" y="258" text-anchor="middle" dominant-baseline="central" fill="rgb(100,98,90)" font-family="system-ui,monospace" font-size="9">questions[]</text>
  <text x="628" y="310" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)" font-family="system-ui,monospace" font-size="9">user_answers[]</text>
  <text x="628" y="340" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)" font-family="system-ui,monospace" font-size="9">needs_hitl</text>
  <text x="628" y="480" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)" font-family="system-ui,monospace" font-size="9">validation{}</text>
  <text x="628" y="510" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)" font-family="system-ui,monospace" font-size="9">competitors[]</text>
  <text x="628" y="580" text-anchor="middle" dominant-baseline="central" fill="rgb(100,98,90)" font-family="system-ui,monospace" font-size="9">architecture{}</text>
  <text x="628" y="610" text-anchor="middle" dominant-baseline="central" fill="rgb(100,98,90)" font-family="system-ui,monospace" font-size="9">svg_diagram</text>
  <text x="628" y="680" text-anchor="middle" dominant-baseline="central" fill="rgb(100,98,90)" font-family="system-ui,monospace" font-size="9">tech_stack{}</text>
  <text x="628" y="710" text-anchor="middle" dominant-baseline="central" fill="rgb(100,98,90)" font-family="system-ui,monospace" font-size="9">learning_gaps[]</text>
  <text x="628" y="780" text-anchor="middle" dominant-baseline="central" fill="rgb(100,98,90)" font-family="system-ui,monospace" font-size="9">exec_plan{}</text>
  <text x="628" y="810" text-anchor="middle" dominant-baseline="central" fill="rgb(100,98,90)" font-family="system-ui,monospace" font-size="9">risks[]</text>
  <text x="628" y="880" text-anchor="middle" dominant-baseline="central" fill="rgb(100,98,90)" font-family="system-ui,monospace" font-size="9">blueprint_md</text>
  <text x="628" y="910" text-anchor="middle" dominant-baseline="central" fill="rgb(100,98,90)" font-family="system-ui,monospace" font-size="9">pdf_path</text>

  <!-- Dotted lines state sidebar → nodes -->
  <line x1="590" y1="140" x2="480" y2="134" stroke="rgb(60,60,55)" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="590" y1="222" x2="480" y2="222" stroke="rgb(60,60,55)" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="590" y1="325" x2="266" y2="325" stroke="rgb(239,159,39)" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="590" y1="495" x2="480" y2="475" stroke="rgb(93,202,165)" stroke-width="0.8" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="590" y1="595" x2="480" y2="575" stroke="rgb(60,60,55)" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="590" y1="695" x2="480" y2="675" stroke="rgb(60,60,55)" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="590" y1="795" x2="480" y2="778" stroke="rgb(60,60,55)" stroke-width="0.8" stroke-dasharray="3,3"/>
  <line x1="590" y1="895" x2="480" y2="882" stroke="rgb(60,60,55)" stroke-width="0.8" stroke-dasharray="3,3"/>

  <!-- ── LEGEND ──────────────────────────────────────────────────────── -->
  <rect x="20" y="960" width="12" height="12" rx="2" fill="rgb(175,169,236)"/>
  <text x="38" y="970" dominant-baseline="central" fill="rgb(194,192,182)" font-family="system-ui,sans-serif" font-size="12">Sequential node</text>
  <rect x="20" y="980" width="12" height="12" rx="2" fill="rgb(93,202,165)"/>
  <text x="38" y="990" dominant-baseline="central" fill="rgb(194,192,182)" font-family="system-ui,sans-serif" font-size="12">Tool-calling node</text>
  <rect x="20" y="1000" width="12" height="12" rx="2" fill="rgb(239,159,39)"/>
  <text x="38" y="1010" dominant-baseline="central" fill="rgb(194,192,182)" font-family="system-ui,sans-serif" font-size="12">HITL / conditional</text>
  <rect x="20" y="1020" width="12" height="12" rx="2" fill="rgb(68,68,65)" stroke="rgb(180,178,169)" stroke-width="0.5"/>
  <text x="38" y="1030" dominant-baseline="central" fill="rgb(194,192,182)" font-family="system-ui,sans-serif" font-size="12">Input / Output</text>

</svg>
